name: Build Adhan (ARMv8)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Load image cache
        id: cache-load
        uses: actions/cache@v4
        with:
          path: /tmp/.image-cache-armv8
          key: image-cache-armv8
      - name: Prepare image builder
        uses: docker/setup-buildx-action@v3
        if: steps.cache-load.outputs.cache-hit != 'true'
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: |
            adhan-armv8:latest
            localhost/adhan-armv8:latest
          cache-from: type=local,src=/tmp/.image-cache-armv8
          cache-to: type=local,dest=/tmp/.image-cache-armv8
          file: Dockerfile_RPI3
        if: steps.cache-load.outputs.cache-hit != 'true'
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-gnu
          override: true
      - uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --target aarch64-unknown-linux-gnu --profile size
        