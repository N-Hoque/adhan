name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Valid platform/arch combinations:
#
#   OS        | x86_64 | aarch64 (ARMv8) | armv7
#   ----------|--------|-----------------|------
#   Linux     |   ✓    |   ✓ (cross)     |  ✓ (cross)
#   macOS     |   ✓    |   ✓ (native)    |  ✗
#   Windows   |   ✓    |   ✗             |  ✗

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ─────────────────────────────────────────────────────────
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            archive_ext: tar.gz
            asset_suffix: linux-x86_64

          - name: Linux aarch64 (ARMv8)
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            archive_ext: tar.gz
            asset_suffix: linux-aarch64

          - name: Linux armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            use_cross: true
            archive_ext: tar.gz
            asset_suffix: linux-armv7

          # ── macOS ──────────────────────────────────────────────────────────
          # macos-15-large is an Intel (x86_64) runner
          - name: macOS x86_64
            os: macos-15-large
            target: x86_64-apple-darwin
            use_cross: false
            archive_ext: tar.gz
            asset_suffix: macos-x86_64

          # macos-latest resolves to an Apple Silicon (arm64) runner
          - name: macOS aarch64 (ARMv8)
            os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            archive_ext: tar.gz
            asset_suffix: macos-aarch64

          # ── Windows ────────────────────────────────────────────────────────
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            archive_ext: zip
            asset_suffix: windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── System dependencies (Linux native only) ──────────────────────────
      # ARM cross-builds get libasound2-dev installed inside the cross
      # container via Cross.toml pre-build hooks instead.
      - name: Install ALSA development libraries (Linux native)
        if: matrix.os == 'ubuntu-latest' && !matrix.use_cross
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libasound2-dev
          version: 1.0

      # ── Rust toolchain ───────────────────────────────────────────────────
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Rust + registry cache ─────────────────────────────────────────────
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── Install cross (ARM cross-compilation only) ────────────────────────
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --profile size --target ${{ matrix.target }} --verbose

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --profile size --target ${{ matrix.target }} --verbose

      # ── Stage binary ──────────────────────────────────────────────────────
      - name: Stage binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/size/adhan staging/adhan

      - name: Stage binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target\${{ matrix.target }}\size\adhan.exe" "staging\adhan.exe"
        shell: pwsh

      # ── Package ───────────────────────────────────────────────────────────
      - name: Package as tar.gz (Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          ARCHIVE="adhan-${{ github.ref_name }}-${{ matrix.asset_suffix }}.tar.gz"
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Package as zip (Windows)
        if: matrix.archive_ext == 'zip'
        run: |
          $archive = "adhan-${{ github.ref_name }}-${{ matrix.asset_suffix }}.zip"
          Compress-Archive -Path staging\* -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      # ── Upload archive as workflow artifact (shared with release job) ─────
      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: adhan-${{ matrix.asset_suffix }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  # ── Create GitHub Release and attach all archives ─────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Merge all per-target subdirectories into one flat directory so
          # the glob below picks everything up cleanly.
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Adhan ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
