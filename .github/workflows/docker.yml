name: Docker
on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
env:
  REGISTRY: ${{ vars.DOCKER_HUB_REGISTRY }}
  IMAGE_NAME: ${{ vars.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}
# Platforms mirroring the valid CI matrix:
#   linux/amd64   → x86_64-unknown-linux-gnu
#   linux/arm64   → aarch64-unknown-linux-gnu  (ARMv8)
#   linux/arm/v7  → armv7-unknown-linux-gnueabihf
jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # QEMU lets the buildx builder transparently emulate arm64 and arm/v7
      # so a single ubuntu-latest runner can produce all three platform images.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Only log in when we are actually going to push (not on PRs).
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      # Derive image tags and OCI labels from the Git ref automatically:
      #   push to main  → ghcr.io/<owner>/adhan:main
      #   push v1.2.3   → ghcr.io/<owner>/adhan:1.2.3, :1.2, :1, :latest
      #   pull_request  → ghcr.io/<owner>/adhan:pr-<n>  (not pushed)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=adhan
            org.opencontainers.image.description=Prayer time player and scheduler
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored in the registry itself, keyed per platform so
          # arm64 and arm/v7 layers don't evict each other.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
