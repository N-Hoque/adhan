name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Valid platform/arch combinations:
#
#   OS        | x86_64 | aarch64 (ARMv8) | armv7
#   ----------|--------|-----------------|------
#   Linux     |   ✓    |   ✓ (cross)     |  ✓ (cross)
#   macOS     |   ✓    |   ✓ (native M-series runner) | ✗
#   Windows   |   ✓    |   ✗             |  ✗

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ────────────────────────────────────────────────────────
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            run_tests: true

          - name: Linux aarch64 (ARMv8)
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            run_tests: false

          - name: Linux armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            use_cross: true
            run_tests: false

          # ── macOS ─────────────────────────────────────────────────────────
          # macos-15-large is an Intel (x86_64) runner
          - name: macOS x86_64
            os: macos-15-large
            target: x86_64-apple-darwin
            use_cross: false
            run_tests: true

          # macos-latest resolves to an Apple Silicon (arm64) runner
          - name: macOS aarch64 (ARMv8)
            os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            run_tests: true

          # ── Windows ───────────────────────────────────────────────────────
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            run_tests: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── System dependencies (Linux native only) ──────────────────────────
      # ARM cross-builds get libasound2-dev installed inside the cross
      # container via Cross.toml pre-build hooks instead.
      - name: Install ALSA development libraries (Linux native)
        if: matrix.os == 'ubuntu-latest' && !matrix.use_cross
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libasound2-dev
          version: 1.0

      # ── Rust toolchain ───────────────────────────────────────────────────
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Rust + registry cache ─────────────────────────────────────────────
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── Install cross (ARM cross-compilation only) ────────────────────────
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --profile size --target ${{ matrix.target }} --verbose

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --profile size --target ${{ matrix.target }} --verbose

      # ── Test (native targets only) ────────────────────────────────────────
      - name: Run tests (cargo)
        if: matrix.run_tests && !matrix.use_cross
        run: cargo test --target ${{ matrix.target }} --verbose
