[package]
name = "adhan"
version = "2.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[dependencies]
salah = { git = "https://github.com/N-Hoque/salah", branch = "v0.9.0", features = [
    "serde",
] }
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.20", features = ["derive"] }
directories-next = "2.0.0"
log = "0.4.22"
rand = "0.8.5"
rodio = "0.20.1"
serde = { version = "1.0.214", features = ["derive"] }
serde_yaml = "0.9.34"
simplelog = "0.12.2"
thiserror = "2.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.9.2"
bytemuck = "1"
ringbuf = "0.4"

[profile.size]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
debug = 0
