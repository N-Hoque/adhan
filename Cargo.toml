[package]
name = "adhan"
version = "2.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[dependencies]
salah = { git = "https://github.com/N-Hoque/salah", branch = "v0.9.0", features = [
    "serde",
] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
directories-next = "2.0.0"
log = "0.4.29"
rand = "0.10.1"
rodio = "0.22.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
simplelog = "0.12.2"
thiserror = "2.0.18"
notify-rust = "4.15.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.9.2"
bytemuck = "1.25.0"
ringbuf = "0.4.8"

[profile.size]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
debug = 0
