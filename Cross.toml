# Cross.toml
# ----------
# Configuration for `cross` (https://github.com/cross-rs/cross).
#
# The official cross images are Ubuntu 20.04 (Focal) based. Focal's glibc is
# 2.31, but PipeWire 0.3.x requires libc6 >= 2.34. We therefore use custom
# Dockerfiles based on debian:bookworm (glibc 2.36) for both ARM targets.
# The Dockerfiles live in docker/ at the repo root.
#
# cross does not forward arbitrary env vars into the container by default.
# We use env.passthrough with VAR=VALUE syntax to inject the pkg-config and
# bindgen variables that the alsa-sys and libspa-sys/libpipewire-sys build
# scripts require.
#
# Note: the armhf/arm64 sysroot headers land at /usr/include (not under a
# multiarch prefix) in the bookworm image, so no PKG_CONFIG_SYSROOT_DIR is
# needed and BINDGEN_EXTRA_CLANG_ARGS points directly to /usr/include.

[target.aarch64-unknown-linux-gnu]
dockerfile = { file = "docker/cross-aarch64.Dockerfile" }

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
    "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig",
    "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include/pipewire-0.3 -I/usr/include/spa-0.2",
]

[target.armv7-unknown-linux-gnueabihf]
dockerfile = { file = "docker/cross-armv7.Dockerfile" }

[target.armv7-unknown-linux-gnueabihf.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
    "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig",
    "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include/pipewire-0.3 -I/usr/include/spa-0.2",
]
