[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt update && apt upgrade -y",
    "apt install -y libasound2:armhf libasound2-dev:armhf gcc-arm-linux-gnueabihf"
]
env = { passthrough = [
    "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig"
] }

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt update && apt upgrade -y",
    "apt install -y libasound2:arm64 libasound2-dev:arm64 gcc-aarch64-linux-gnu",
]
env = { passthrough = ["PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig"] }
